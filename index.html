<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Biathlon Tracker</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg: #1e1e1e; --text: #ffffff; --accent: #007aff;
            --target-box: #f5f5f5; --target-center: #1a1a1a;
            --shot-color: #ff3b30; --review-bg: #8b4513; 
        }
        body { margin: 0; padding: env(safe-area-inset-top, 15px) env(safe-area-inset-right, 15px) env(safe-area-inset-bottom, 15px) env(safe-area-inset-left, 15px); background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; transition: background-color 0.3s; }
        body.review-mode { background-color: var(--review-bg); }
        body.modal-open { overflow: hidden; }

        .header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; margin-top: 10px; }
        .header-title-container { display: flex; align-items: center; gap: 8px; }
        .series-badge { background-color: rgba(0, 122, 255, 0.2); color: var(--accent); border: 1px solid var(--accent); padding: 4px 10px; border-radius: 8px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .header-btns { display: flex; gap: 5px; }
        .header-btns button { padding: 8px 12px; font-size: 14px; min-width: auto; position: relative; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        select, button, input[type="range"], input[type="text"], input[type="url"], input[type="number"] { padding: 12px; font-size: 14px; border-radius: 8px; border: none; background-color: #333; color: white; flex: 1; min-width: 120px; box-sizing: border-box; }
        button { background-color: var(--accent); font-weight: bold; cursor: pointer; transition: background-color 0.2s;}
        button.secondary { background-color: #555; }
        button.danger { background-color: #d32f2f; }
        button.warning { background-color: #ff9800; color: white; }
        button.success { background-color: #34c759; color: white; }
        
        .btn-delete { width: 36px; height: 36px; padding: 0 !important; display: flex; justify-content: center; align-items: center; flex: 0 0 auto !important; min-width: unset !important; }
        
.target-container { display: flex; justify-content: center; align-items: center; margin: 10px 0; }

.target-box { width: min(100%, 65vh); max-width: 800px; aspect-ratio: 1 / 1.1; background-color: var(--target-box); position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #444; touch-action: none; margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

/* RIGA REINSERITA */
.target-center { width: 90%; aspect-ratio: 1 / 1; background-color: var(--target-center); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        .target-cross-h { width: 100%; height: 1px; background: rgba(255,255,255,0.4); position: absolute; top: 50%; left: 0; }
        .target-cross-v { height: 100%; width: 1px; background: rgba(255,255,255,0.4); position: absolute; top: 0; left: 50%; }
        .target-prone { width: 39.1%; aspect-ratio: 1 / 1; border: 1.5px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .target-dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .shot { width: 22px; height: 22px; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); border: 2px solid white; cursor: grab; z-index: 10; display: flex; justify-content: center; align-items: center; color: white; font-size: 11px; font-weight: bold; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease, background-color 0.15s ease; }        .shot.hit { background-color: #34c759; } /* Verde */
        .shot.miss { background-color: #ff3b30; } /* Rosso */
        .shot.dragging { cursor: grabbing; transform: translate(-50%, -50%) scale(1.3); }
        .slider-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .slider-container span { min-width: 60px; text-align: center; font-weight: bold; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; overscroll-behavior: none; }
        .modal { background: #222; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .modal h3 { margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; font-size: 18px; }
        .list-container { list-style: none; padding: 0; margin: 0; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; font-size: 14px;}
        .list-item-info { display: flex; flex-direction: column; gap: 3px; }
        .list-item-date { font-size: 11px; color: #aaa; }
        .list-item-btns { display: flex; gap: 5px; align-items: center; }
        .list-item-btns button:not(.btn-delete) { padding: 6px 10px; min-width: auto; font-size: 12px; }
        
        .input-row { display: flex; gap: 10px; align-items: center; }
        .compact-btns { display: flex; gap: 10px; }
        .compact-btns button { padding: 8px; font-size: 13px; }
        .section-box { background: #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444; }
        .section-box label { font-size: 12px; font-weight: bold; color: #aaa;}
        .cloud-content { display: none; margin-top: 10px; }
        .cloud-content.active { display: flex; flex-direction: column; gap: 10px; }
        
        .checklist { max-height: 250px; overflow-y: auto; background: #333; border-radius: 8px; padding: 10px; border: 1px solid #444;}
        .checklist label { display: flex; align-items: center; gap: 10px; padding: 12px 5px; border-bottom: 1px solid #444; font-size: 16px; cursor: pointer;}
        .checklist label:last-child { border-bottom: none; }
        .checklist input[type="checkbox"] { flex: 0 0 auto; width: 20px; height: 20px; }

        .pos-segmented { display: flex; background: #111; border-radius: 8px; padding: 3px; gap: 4px; }
        .pos-segmented button { flex: 1; padding: 10px; border-radius: 6px; background: transparent; color: #aaa; font-size: 14px; font-weight: bold; }
        .pos-segmented button.active { background: var(--accent); color: white; }
        .stepper-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
        .stepper-btn { width: 50px; height: 50px; font-size: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; padding: 0; min-width: unset; }
        .stepper-value { font-size: 32px; font-weight: bold; min-width: 80px; text-align: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title-container">
            <span id="display-name">Nessun Atleta</span>
            <span id="display-series" class="series-badge" onclick="openSeriesModal()">1T ✏️</span>
        </div>
        <div class="header-btns" id="header-btns">
            <button class="secondary" onclick="openHistory()">Storico</button>
            <button class="secondary" onclick="openSettings()">⚙️ Impostazioni</button>
        </div>
    </div>

    <!-- Controlli Modalità -->
    <div class="controls" id="normal-controls-1">
        <select id="athlete-select"></select>
        <button id="btn-position" class="secondary" onclick="togglePosition()">Pos: T</button>
        <select id="mode-select" class="secondary">
            <option value="Azzeramento">🔧 Azzeramento</option>
            <option value="Gara">🏁 Gara</option>
            <option value="L2">📊 L2</option>
            <option value="L3">📊 L3</option>
            <option value="L4">📊 L4</option>
            <option value="Altro">📝 Altro</option>
        </select>
    </div>

    <div class="target-container">
        <div class="target-box" id="target-box">
            <div class="target-center">
                <div class="target-cross-h"></div>
                <div class="target-cross-v"></div>
                <div class="target-prone"></div>
                <div class="target-dot"></div>
            </div>
        </div>
    </div>

    <div class="slider-container">
        <input type="range" id="time-slider" min="0" max="0" value="0" step="1">
        <span id="slider-val">0 / 0</span>
    </div>

    <div class="controls" id="normal-controls-2">
        <button onclick="saveSeries()" style="flex: 2;">Salva</button>
        <button class="secondary" onclick="undoLastShot()">↩️ Annulla</button>
        <button class="danger" onclick="clearTargetAndState()">Reset</button>
    </div>
    
    <div class="controls" id="normal-controls-3">
        <button id="btn-sync" class="secondary" onclick="syncWithCloud()" style="flex: 1;">☁️ Sincronizzato</button>
        <button class="warning" onclick="openNewSessionModal()" style="flex: 1;">🔄 Nuova Sessione</button>
    </div>

    <div class="controls hidden" id="review-controls">
        <button class="secondary" onclick="exportImage()">Condividi Immagine</button>
        <button style="background-color: #fff; color: #000;" onclick="exitReviewMode()">⬅ Torna all'Allenamento</button>
    </div>

    <!-- Modale Modifica Posizione & Numero Serie -->
    <div class="modal-overlay" id="series-modal">
        <div class="modal">
            <h3>🎯 Imposta Serie e Posizione</h3>
            <p id="series-modal-desc" style="font-size: 13px; color: #ccc; margin-top: 0;"></p>
            
            <label style="font-size: 12px; font-weight: bold; color: #aaa;">POSIZIONE</label>
            <div class="pos-segmented">
                <button type="button" id="seg-btn-t" onclick="setModalPosition('T')">Terra (T)</button>
                <button type="button" id="seg-btn-p" onclick="setModalPosition('P')">Piedi (P)</button>
            </div>

            <label style="font-size: 12px; font-weight: bold; color: #aaa; margin-top: 10px;">NUMERO SERIE</label>
            <div class="stepper-container">
                <button type="button" class="secondary stepper-btn" onclick="stepSeries(-1)">−</button>
                <div class="stepper-value" id="series-stepper-val">1T</div>
                <button type="button" class="secondary stepper-btn" onclick="stepSeries(1)">+</button>
            </div>

            <div class="input-row">
                <button type="button" class="secondary" onclick="closeSeriesModal()">Annulla</button>
                <button type="button" class="accent" onclick="applySeriesChange()">Conferma</button>
            </div>
        </div>
    </div>

    <!-- Modale Impostazioni -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>⚙️ Impostazioni App</h3>
            <button class="secondary" onclick="toggleCloudConfig()" style="display: flex; justify-content: space-between; align-items: center;">
                <span>☁️ Configura Cloud & Firma</span><span>▼</span>
            </button>
            <div class="cloud-content section-box" id="cloud-config-panel">
                <label>LA TUA FIRMA (ALLENATORE)</label>
                <!-- Tolto onchange: il salvataggio avviene in tempo reale via JS -->
                <input type="text" id="coach-name" placeholder="Es. Matteo Finco">
                <label style="margin-top: 10px;">URL GOOGLE SHEETS</label>
                <!-- Tolto onchange: il salvataggio avviene in tempo reale via JS -->
                <input type="url" id="sheet-url" placeholder="https://script.google.com/...">
            </div>

            <h3 style="margin-top: 10px;">Archivio Atleti</h3>
            <div class="input-row">
                <input type="text" id="new-athlete-name" placeholder="Nuovo atleta...">
                <button onclick="addAthlete()">Aggiungi</button>
            </div>
            <ul class="list-container" id="modal-athlete-list" style="max-height: 150px; overflow-y: auto;"></ul>
            
            <div class="compact-btns">
                <button class="secondary" onclick="exportRoster()">📤 Esporta Archivio</button>
                <button class="secondary" onclick="document.getElementById('import-roster-file').click()">📥 Importa</button>
                <input type="file" id="import-roster-file" accept=".json" style="display: none;" onchange="importRoster(event)">
            </div>

            <h3 style="margin-top: 10px;">Dati e Backup</h3>
            <div class="compact-btns">
                <button class="success" id="btn-export-zip" onclick="exportFullSession()">📥 Esporta Sessione</button>
                <button class="danger" onclick="factoryReset()">⚠️ Reset Totale</button>
            </div>
            <button class="secondary" onclick="closeSettings()" style="margin-top: 10px;">Chiudi</button>
        </div>
    </div>

    <!-- Modale Nuova Sessione -->
    <div class="modal-overlay" id="new-session-modal">
        <div class="modal">
            <h3>🔄 Inizia Nuova Sessione</h3>
            <p style="font-size: 13px; color: #ccc; margin-top: 0;">Seleziona gli atleti presenti al poligono oggi. I contatori ripartiranno da 1.</p>
            <div class="checklist" id="session-checklist"></div>
            <div class="input-row">
                <button class="secondary" onclick="closeNewSessionModal()">Annulla</button>
                <button class="accent" onclick="startNewSession()">Avvia Sessione</button>
            </div>
        </div>
    </div>

    <!-- Modale Storico -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal">
            <h3>Storico <span id="history-athlete-name" style="color: var(--accent);"></span></h3>
            <ul class="list-container" id="modal-history-list"></ul>
            <button class="secondary" onclick="closeHistory()" style="margin-top: 10px;">Chiudi</button>
        </div>
    </div>

    <script>
        const MAX_SHOTS = 8;
        const STORAGE_KEY = 'biathlon_tracker_data_v5';

        let state = {
            coachName: "", cloudUrl: "", roster: [ { id: 1, name: "Atleta di Test" } ],
            activeAthletes: [ { id: 1, name: "Atleta di Test", seriesT: 1, seriesP: 1 } ],
            currentAthleteId: 1, currentPos: 'T', currentMode: 'Allenamento', 
            currentShots: [], history: [], syncQueue: [], deleteQueue: [], reviewMode: null 
        };

        let modalSelectedPos = 'T'; let modalSeriesValues = { T: 1, P: 1 };
        const targetEl = document.getElementById('target-box');
        const athleteSelect = document.getElementById('athlete-select');
        const slider = document.getElementById('time-slider');
        const sliderVal = document.getElementById('slider-val');
        
        let draggedShot = null; let isDragging = false; let longPressTimer = null;

        function init() {
            loadState(); 
            refreshInterface();
            
            // Ripristina i valori nei campi di input
            document.getElementById('coach-name').value = state.coachName;
            document.getElementById('sheet-url').value = state.cloudUrl;
            
            // FASE 1: Salvataggio istantaneo in memoria. Nessun dato andrà più perso
            // se chiudi l'app mentre stai digitando.
            document.getElementById('coach-name').addEventListener('input', (e) => {
                state.coachName = e.target.value.trim();
                saveState();
            });
            document.getElementById('sheet-url').addEventListener('input', (e) => {
                state.cloudUrl = e.target.value.trim();
                saveState();
            });

            slider.addEventListener('input', updateVisualsFromSlider);
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('touchmove', (e) => { if(e.target === overlay) e.preventDefault(); }, { passive: false });
            });
        }

        // Calcola la distanza e valuta l'esito
        function evaluateShot(x, y, bx, by, pos) {
            const normX = (x / bx) * 400;
            const normY = (y / by) * 440;
            const dist = Math.sqrt(Math.pow(normX - 200, 2) + Math.pow(normY - 220, 2));
            const threshold = pos === 'T' ? 70.4 : 180;
            return dist <= threshold;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; document.body.classList.add('modal-open'); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; document.body.classList.remove('modal-open'); }
        function getActiveShots() { return state.reviewMode ? state.reviewMode.shots : state.currentShots; }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateSyncBadge(); if(!state.reviewMode) updateSliderMax();
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const p = JSON.parse(saved);
                    state.coachName = p.coachName || ""; state.cloudUrl = p.cloudUrl || "";
                    if (p.roster) { state.roster = p.roster; }
                    if (p.activeAthletes) { state.activeAthletes = p.activeAthletes; }
                    state.currentAthleteId = p.currentAthleteId; state.currentPos = p.currentPos || 'T'; 
                    state.currentMode = p.currentMode || 'Allenamento';
                    state.currentShots = p.currentShots || []; state.history = p.history || []; 
                    state.syncQueue = p.syncQueue || []; state.deleteQueue = p.deleteQueue || [];
                    if(!state.roster.length) forceDefaultAthlete();
                } catch (e) { forceDefaultAthlete(); }
            } else { forceDefaultAthlete(); }
            if(!state.activeAthletes.find(a => a.id === state.currentAthleteId)) {
                if(state.activeAthletes.length > 0) state.currentAthleteId = state.activeAthletes[0].id;
            }
        }

        function forceDefaultAthlete() {
            const id = Date.now();
            state.roster = [{ id: id, name: "Atleta di Test" }]; state.activeAthletes = [{ id: id, name: "Atleta di Test", seriesT: 1, seriesP: 1 }];
            state.currentAthleteId = id;
        }

        function refreshInterface() {
            athleteSelect.innerHTML = '';
            if(state.activeAthletes.length === 0) {
                const opt = document.createElement('option'); opt.textContent = "-- Nessun atleta presente --";
                athleteSelect.appendChild(opt); athleteSelect.disabled = true;
            } else {
                athleteSelect.disabled = false;
                state.activeAthletes.forEach(a => {
                    const opt = document.createElement('option'); opt.value = a.id; opt.textContent = a.name;
                    if(a.id === state.currentAthleteId) opt.selected = true; athleteSelect.appendChild(opt);
                });
            }
            athleteSelect.onchange = (e) => { state.currentAthleteId = parseInt(e.target.value); saveState(); updateHeader(); };
            
            const modeSelect = document.getElementById('mode-select');

            // Controllo di sicurezza: se in memoria c'è ancora il vecchio "Allenamento", lo passiamo ad "Altro"
            const validModes = ["Azzeramento", "Gara", "L2", "L3", "L4", "Altro"];
            if (!validModes.includes(state.currentMode)) state.currentMode = "Azzeramento";

            modeSelect.value = state.currentMode;
            modeSelect.onchange = (e) => { 
                state.currentMode = e.target.value; 
                saveState(); 
            };

            updateHeader(); renderShotsFromState(); toggleReviewUI(); updateSyncBadge();
        }

        function updateHeader() {
            const badgeEl = document.getElementById('display-series');
            if(state.reviewMode) {
                document.getElementById('display-name').textContent = state.reviewMode.athlete;
                badgeEl.textContent = `Rev. ${state.reviewMode.series}`;
                badgeEl.style.pointerEvents = 'none'; return;
            }
            badgeEl.style.pointerEvents = 'auto';
            const athlete = state.activeAthletes.find(a => a.id === state.currentAthleteId);
            if(!athlete) {
                document.getElementById('display-name').textContent = "Nessuno"; badgeEl.textContent = "-"; return;
            }
            document.getElementById('display-name').textContent = athlete.name;
            const seriesNum = state.currentPos === 'T' ? athlete.seriesT : athlete.seriesP;
            badgeEl.textContent = `${seriesNum}${state.currentPos} ✏️`;
            document.getElementById('btn-position').textContent = `Pos: ${state.currentPos}`;
        }

        function openSeriesModal() {
            if(state.reviewMode || state.activeAthletes.length === 0) return;
            const athlete = state.activeAthletes.find(a => a.id === state.currentAthleteId);
            if(!athlete) return;
            modalSelectedPos = state.currentPos;
            modalSeriesValues = { T: athlete.seriesT, P: athlete.seriesP };
            document.getElementById('series-modal-desc').textContent = athlete.name;
            updateModalPosUI(); openModal('series-modal');
        }
        function closeSeriesModal() { closeModal('series-modal'); }
        function setModalPosition(pos) { modalSelectedPos = pos; updateModalPosUI(); }
        function updateModalPosUI() {
            document.getElementById('seg-btn-t').classList.toggle('active', modalSelectedPos === 'T');
            document.getElementById('seg-btn-p').classList.toggle('active', modalSelectedPos === 'P');
            document.getElementById('series-stepper-val').textContent = `${modalSeriesValues[modalSelectedPos]}${modalSelectedPos}`;
        }
        function stepSeries(delta) { modalSeriesValues[modalSelectedPos] = Math.max(1, modalSeriesValues[modalSelectedPos] + delta); updateModalPosUI(); }
        
        function applySeriesChange() {
            const athlete = state.activeAthletes.find(a => a.id === state.currentAthleteId);
            if(athlete) {
                athlete.seriesT = modalSeriesValues.T; 
                athlete.seriesP = modalSeriesValues.P;
                state.currentPos = modalSelectedPos; 
                saveState(); 
                updateHeader();
                renderShotsFromState(); // Forza il ricalcolo dei colori
            }
            closeSeriesModal();
        }

        function togglePosition() { 
            state.currentPos = state.currentPos === 'T' ? 'P' : 'T'; 
            saveState(); 
            updateHeader(); 
            renderShotsFromState(); // Forza il ricalcolo dei colori
        }
        
        function toggleMode() {
            state.currentMode = state.currentMode === 'Allenamento' ? 'Azzeramento' : 'Allenamento';
            saveState(); refreshInterface();
        }

        function toggleReviewUI() {
            const isReview = state.reviewMode !== null;
            document.body.classList.toggle('review-mode', isReview);
            document.getElementById('normal-controls-1').classList.toggle('hidden', isReview);
            document.getElementById('normal-controls-2').classList.toggle('hidden', isReview);
            document.getElementById('normal-controls-3').classList.toggle('hidden', isReview);
            document.getElementById('header-btns').classList.toggle('hidden', isReview);
            document.getElementById('review-controls').classList.toggle('hidden', !isReview);
        }

        function toggleCloudConfig() { document.getElementById('cloud-config-panel').classList.toggle('active'); }

        function updateSyncBadge() {
            const count = state.syncQueue.length + state.deleteQueue.length;
            const syncBtn = document.getElementById('btn-sync');
            if(syncBtn) {
                if(count > 0) {
                    syncBtn.textContent = `☁️ Sincronizza (${count})`; syncBtn.className = '';
                } else {
                    syncBtn.textContent = `☁️ Sincronizzato`; syncBtn.className = 'secondary';
                }
            }
        }

        // FASE 2: Coda di sincronizzazione (Offline Queue) - Implementazione sicura
        async function syncWithCloud() {
            if(state.syncQueue.length === 0 && state.deleteQueue.length === 0) return alert("Tutti i dati sono già sincronizzati.");
            if(!state.cloudUrl || !state.cloudUrl.startsWith('http')) return alert("Devi prima configurare l'URL nelle impostazioni.");
            if(!state.coachName) return alert("Devi inserire la tua firma nelle impostazioni.");
            
            const btn = document.getElementById('btn-sync'); 
            btn.textContent = "⏳ Invio..."; btn.disabled = true;

            const payload = { inserts: state.syncQueue, deletes: state.deleteQueue };

            try {
                const response = await fetch(state.cloudUrl, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === "success") {
                    // INVIO RIUSCITO: Svuotiamo la coda e salviamo lo stato
                    state.syncQueue = []; state.deleteQueue = []; saveState(); alert("Sincronizzazione completata!");
                } else { alert("Errore dallo script: " + result.error); }
            } catch (err) { 
                // INVIO FALLITO: I dati restano bloccati in state.syncQueue in attesa del prossimo tentativo manuale.
                alert("Rete assente o instabile. I dati sono al sicuro nel telefono, riprova appena la connessione migliora."); 
            } finally { 
                btn.disabled = false; updateSyncBadge(); 
            }
        }

        function openNewSessionModal() { 
            const list = document.getElementById('session-checklist'); list.innerHTML = '';
            state.roster.forEach(athlete => {
                const isCurrentlyActive = state.activeAthletes.some(a => a.id === athlete.id);
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${athlete.id}" ${isCurrentlyActive ? 'checked' : ''}> ${athlete.name}`;
                list.appendChild(label);
            });
            openModal('new-session-modal');
        }
        function closeNewSessionModal() { closeModal('new-session-modal'); }
        function startNewSession() {
            if(state.currentShots.length > 0 && !confirm("Hai colpi non salvati sul bersaglio. Procedere comunque?")) return;
            const checkboxes = document.querySelectorAll('#session-checklist input[type="checkbox"]:checked');
            const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            state.history = []; state.currentShots = []; state.reviewMode = null; state.currentMode = 'Allenamento';
            state.activeAthletes = state.roster.filter(a => selectedIds.includes(a.id)).map(a => ({ id: a.id, name: a.name, seriesT: 1, seriesP: 1 }));
            if(state.activeAthletes.length > 0) state.currentAthleteId = state.activeAthletes[0].id;
            saveState(); refreshInterface(); closeNewSessionModal();
        }

        function openSettings() { renderRosterList(); openModal('settings-modal'); }
        function closeSettings() { closeModal('settings-modal'); }
        function renderRosterList() { 
            const list = document.getElementById('modal-athlete-list'); list.innerHTML = '';
            state.roster.forEach(a => {
                const li = document.createElement('li'); li.className = 'list-item';
                li.innerHTML = `<span>${a.name}</span> <button class="danger btn-delete" onclick="removeAthlete(${a.id})">X</button>`;
                list.appendChild(li);
            });
        }
        function addAthlete() { const input = document.getElementById('new-athlete-name'); const name = input.value.trim(); if(!name) return; state.roster.push({ id: Date.now(), name: name }); input.value = ''; saveState(); renderRosterList(); }
        function removeAthlete(id) { if(!confirm("Rimuovere definitivamente?")) return; state.roster = state.roster.filter(a => a.id !== id); state.activeAthletes = state.activeAthletes.filter(a => a.id !== id); saveState(); renderRosterList(); refreshInterface(); }
        // --- ESPORTAZIONE ARCHIVIO ATLETI ---
        function exportRoster() {
            if (state.roster.length === 0) return alert("Nessun atleta in archivio da esportare.");
            
            // Converte l'array in una stringa JSON formattata in modo leggibile
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.roster, null, 2));
            
            // Crea un link invisibile, gli aggancia il file e lo "clicca" automaticamente
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "archivio_atleti_biathlon.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // --- IMPORTAZIONE ARCHIVIO ATLETI ---
        function importRoster(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedRoster = JSON.parse(event.target.result);
                    
                    // Controllo base di sicurezza: verifica che sia un array
                    if (Array.isArray(importedRoster)) {
                        state.roster = importedRoster;
                        saveState();
                        renderRosterList();
                        refreshInterface();
                        alert("Archivio atleti importato con successo!");
                    } else {
                        alert("Errore: Il file non contiene una lista valida di atleti.");
                    }
                } catch (err) {
                    alert("Errore critico nella lettura del file JSON.");
                }
                // Svuota l'input file per permettere di ricaricare lo stesso file se si sbaglia
                e.target.value = ''; 
            };
            reader.readAsText(file);
        }
        function factoryReset() { if(!confirm("ATTENZIONE: Reset totale?")) return; localStorage.removeItem(STORAGE_KEY); location.reload(); }

        function openHistory() {
            if(state.activeAthletes.length === 0) return alert("Nessun atleta attivo.");
            const athlete = state.activeAthletes.find(a => a.id === state.currentAthleteId);
            document.getElementById('history-athlete-name').textContent = athlete.name;
            const list = document.getElementById('modal-history-list'); list.innerHTML = '';
            const athleteHistory = state.history.filter(h => h.athleteId === athlete.id).reverse();
            
            if(athleteHistory.length === 0) { list.innerHTML = '<li style="text-align:center; padding: 20px 0; color:#aaa;">Nessuna serie salvata oggi.</li>'; } 
            else {
                athleteHistory.forEach(h => {
                    const li = document.createElement('li'); li.className = 'list-item';
                    const date = new Date(h.timestamp); const dateStr = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                    const typeIcon = h.type === 'Azzeramento' ? '🔧' : '🎯';
                    li.innerHTML = `<div class="list-item-info"><strong>${typeIcon} Serie ${h.series}</strong><span class="list-item-date">${dateStr} - ${h.shots.length} colpi</span></div><div class="list-item-btns"><button onclick="viewHistoryItem('${h.id}')">Apri</button><button class="danger btn-delete" onclick="deleteHistoryItem('${h.id}')">X</button></div>`;
                    list.appendChild(li);
                });
            }
            openModal('history-modal');
        }
        function closeHistory() { closeModal('history-modal'); }
        
        function deleteHistoryItem(id) { 
            if(!confirm("Eliminare? Questa azione rimuoverà i dati anche dal foglio Google alla prossima sincronizzazione.")) return; 
            
            state.deleteQueue.push(id.toString());
            state.syncQueue = state.syncQueue.filter(q => q.id.toString() !== id.toString());
            state.history = state.history.filter(h => h.id.toString() !== id.toString()); 
            
            saveState(); openHistory(); 
        }
        
        function viewHistoryItem(id) { const item = state.history.find(h => h.id.toString() === id.toString()); if(!item) return; state.reviewMode = item; closeHistory(); refreshInterface(); }
        function exitReviewMode() { state.reviewMode = null; refreshInterface(); }

        // --- 1. RIPRISTINATO L'ASCOLTATORE DEL TOCCO (Mancava!) ---
        targetEl.addEventListener('pointerdown', (e) => {
            if(state.reviewMode || state.activeAthletes.length === 0) return; 
            if (parseInt(slider.value) < state.currentShots.length) { slider.value = state.currentShots.length; updateVisualsFromSlider(); }
            if (e.target.classList.contains('shot')) {
                const shotNode = e.target;
                longPressTimer = setTimeout(() => { isDragging = true; draggedShot = shotNode; shotNode.classList.add('dragging'); targetEl.setPointerCapture(e.pointerId); if (navigator.vibrate) navigator.vibrate(50); }, 800);
            } else if (e.target.id === 'target-box' || e.target.closest('.target-center')) {
                if (state.currentShots.length >= MAX_SHOTS) return;
                const rect = targetEl.getBoundingClientRect(); createShot(e.clientX - rect.left, e.clientY - rect.top);
            }
        });

        // --- 2. LOGICA DI TRASCINAMENTO E COLORE DINAMICO ---
        targetEl.addEventListener('pointermove', (e) => {
            if (isDragging && draggedShot && !state.reviewMode) {
                const rect = targetEl.getBoundingClientRect();
                let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width)); 
                let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
                draggedShot.style.left = `${x}px`; draggedShot.style.top = `${y}px`;
                
                const seqIndex = parseInt(draggedShot.dataset.seq) - 1;
                state.currentShots[seqIndex].x = x; 
                state.currentShots[seqIndex].y = y;

                // Cambio colore dinamico durante il trascinamento
                const isHit = evaluateShot(x, y, targetEl.offsetWidth, targetEl.offsetHeight, state.currentPos);
                if(isHit) {
                    draggedShot.classList.replace('miss', 'hit') || draggedShot.classList.add('hit');
                } else {
                    draggedShot.classList.replace('hit', 'miss') || draggedShot.classList.add('miss');
                }
            }
        });

        const handlePointerUp = (e) => {
            if (longPressTimer) {
                clearTimeout(longPressTimer); longPressTimer = null;
                if (e.target.classList.contains('shot')) {
                    if (state.currentShots.length >= MAX_SHOTS) return;
                    const rect = targetEl.getBoundingClientRect(); createShot(e.clientX - rect.left, e.clientY - rect.top);
                }
            }
            if (isDragging && draggedShot) { draggedShot.classList.remove('dragging'); targetEl.releasePointerCapture(e.pointerId); draggedShot = null; isDragging = false; saveState(); }
        };

        targetEl.addEventListener('pointerup', handlePointerUp); targetEl.addEventListener('pointercancel', handlePointerUp); 
        function undoLastShot() { if (state.reviewMode || state.currentShots.length === 0) return; state.currentShots.pop(); saveState(); renderShotsFromState(); }

        // --- 3. CREAZIONE E RENDERING PULITI ---
        function createShot(x, y) {
            const seq = state.currentShots.length + 1;
            state.currentShots.push({ seq, x, y, bx: targetEl.offsetWidth, by: targetEl.offsetHeight });
            saveState(); 
            appendShotDOM(seq, x, y, state.currentPos); 
            slider.value = state.currentShots.length; updateVisualsFromSlider();
        }

        function appendShotDOM(seq, x, y, pos) {
            const shotEl = document.createElement('div'); 
            shotEl.className = 'shot'; 
            shotEl.dataset.seq = seq;
            shotEl.style.left = `${x}px`; 
            shotEl.style.top = `${y}px`; 
            shotEl.textContent = seq; 
            
            // Valutazione istantanea del colore
            const isHit = evaluateShot(x, y, targetEl.offsetWidth, targetEl.offsetHeight, pos);
            shotEl.classList.add(isHit ? 'hit' : 'miss');

            targetEl.appendChild(shotEl);
        }

        function renderShotsFromState() {
            targetEl.querySelectorAll('.shot').forEach(s => s.remove()); 
            const shots = getActiveShots();
            const currentPos = state.reviewMode ? state.reviewMode.position : state.currentPos;

            shots.forEach(s => {
                const currentW = targetEl.offsetWidth; const currentH = targetEl.offsetHeight;
                const scaleX = s.bx ? (currentW / s.bx) : 1; const scaleY = s.by ? (currentH / s.by) : 1;
                let renderX = s.x * scaleX; let renderY = s.y * scaleY;
                if(!state.reviewMode) { s.x = renderX; s.y = renderY; s.bx = currentW; s.by = currentH; }
                
                appendShotDOM(s.seq, renderX, renderY, currentPos);
            });
            slider.value = shots.length; updateSliderMax(); updateVisualsFromSlider();
        }

        function updateSliderMax() { slider.max = getActiveShots().length; sliderVal.textContent = `${slider.value} / ${getActiveShots().length}`; }
        function updateVisualsFromSlider() {
            const visibleCount = parseInt(slider.value); sliderVal.textContent = `${visibleCount} / ${getActiveShots().length}`;
            targetEl.querySelectorAll('.shot').forEach(shotEl => { shotEl.style.display = parseInt(shotEl.dataset.seq) <= visibleCount ? 'flex' : 'none'; });
        }
        function clearTargetAndState() { state.currentShots = []; saveState(); renderShotsFromState(); }

        // --- 4. SALVATAGGIO DEI DATI ---
        function saveSeries() {
            if(state.activeAthletes.length === 0) return alert("Nessun atleta selezionato.");
            if (state.currentShots.length === 0) return alert("Nessun colpo.");
            
            const athlete = state.activeAthletes.find(a => a.id === state.currentAthleteId);
            const exportW = 400; const exportH = 440;
            const normalizedShots = state.currentShots.map(s => {
                const scaleX = s.bx ? (exportW / s.bx) : 1; const scaleY = s.by ? (exportH / s.by) : 1;
                const nx = Math.round(s.x * scaleX);
                const ny = Math.round(s.y * scaleY);
                const dist = Math.round(Math.sqrt(Math.pow(nx - 200, 2) + Math.pow(ny - 220, 2)));
                const threshold = state.currentPos === 'T' ? 70 : 180;
                
                return { 
                    seq: s.seq, 
                    x: nx, 
                    y: ny, 
                    distanza: dist, 
                    esito: (dist <= threshold) ? 'Bersaglio' : 'Errore' 
                };
            });
            const uniqueId = `${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
            const timestampIso = new Date().toISOString();
            const seriesLabel = `${state.currentPos === 'T' ? athlete.seriesT : athlete.seriesP}${state.currentPos}`;

            const dataPacket = {
                id: uniqueId, type: state.currentMode, athleteId: athlete.id, athlete: athlete.name, position: state.currentPos,
                series: seriesLabel, shots: JSON.parse(JSON.stringify(state.currentShots)), timestamp: timestampIso
            };
            
            const cloudPacket = {
                id: uniqueId, type: state.currentMode, timestamp: timestampIso, coach: state.coachName || "Non specificato", 
                athlete: athlete.name, position: state.currentPos, series: seriesLabel, shots: normalizedShots
            };

            state.history.push(dataPacket); state.syncQueue.push(cloudPacket);
            if (state.currentPos === 'T') athlete.seriesT++; else athlete.seriesP++;
            clearTargetAndState(); updateHeader();
        }

        function exportImage() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400; 
            canvas.height = 440;
            
            // Disegna sfondo
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, 400, 440);
            
            // Disegna bersaglio centrale
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(200, 220, 180, 0, 2 * Math.PI);
            ctx.fill();
            
            // Disegna anello per posizione a Terra
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(200, 220, 70.4, 0, 2 * Math.PI);
            ctx.stroke();

            // Disegna croce centrale
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 220); ctx.lineTo(400, 220);
            ctx.moveTo(200, 0); ctx.lineTo(200, 440);
            ctx.stroke();
            
            // Disegna i colpi a schermo
            const shots = getActiveShots();
            const currentPos = state.reviewMode ? state.reviewMode.position : state.currentPos;
            
            shots.forEach(s => {
                const normX = (s.x / s.bx) * 400;
                const normY = (s.y / s.by) * 440;
                const isHit = evaluateShot(s.x, s.y, s.bx, s.by, currentPos);
                
                ctx.fillStyle = isHit ? '#34c759' : '#ff3b30';
                ctx.beginPath();
                ctx.arc(normX, normY, 11, 0, 2 * Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.seq, normX, normY);
            });
            
            // Avvia il download
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/jpeg', 0.9);
            a.download = `Rosata_${currentPos}_${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function exportFullSession() {
            if (state.history.length === 0) return alert("Nessun dato nella sessione attuale da esportare.");
            
            const btn = document.getElementById('btn-export-zip');
            const originalText = btn.textContent;
            btn.textContent = "⏳ Preparazione...";
            btn.disabled = true;

            try {
                const zip = new JSZip();
                
                // File JSON di backup
                zip.file("backup_completo.json", JSON.stringify(state, null, 2));
                
                // File CSV per database
                let csvContent = "Data,Tipo,Atleta,Posizione,Serie,N_Colpo,X,Y,Distanza,Esito\n";
                state.history.forEach(serie => {
                    const dateOnly = serie.timestamp.split('T')[0];
                    serie.shots.forEach(shot => {
                        const normX = (shot.x / shot.bx) * 400;
                        const normY = (shot.y / shot.by) * 440;
                        const dist = Math.round(Math.sqrt(Math.pow(normX - 200, 2) + Math.pow(normY - 220, 2)));
                        const threshold = serie.position === 'T' ? 70 : 180;
                        const esito = dist <= threshold ? 'Bersaglio' : 'Errore';
                        
                        csvContent += `${dateOnly},${serie.type},${serie.athlete},${serie.position},${serie.series},${shot.seq},${Math.round(normX)},${Math.round(normY)},${dist},${esito}\n`;
                    });
                });
                zip.file("dati_sessione.csv", csvContent);

                const blob = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `Sessione_Biathlon_${new Date().toISOString().split('T')[0]}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
            } catch (err) {
                alert("Errore durante la creazione dello ZIP: " + err.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        window.addEventListener('resize', () => { if(getActiveShots().length > 0) renderShotsFromState(); });
        init();
    </script>
</body>
</html>
