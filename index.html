<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biathlon Tracker</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --text: #ffffff;
            --accent: #007aff;
            --target-box: #ffffff;
            --target-center: #000000;
            --shot-color: #ff3b30;
        }
        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            touch-action: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        select, button, input[type="range"] {
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background-color: #333;
            color: white;
            flex: 1;
            min-width: 120px;
        }
        button {
            background-color: var(--accent);
            font-weight: bold;
            cursor: pointer;
        }
        button.secondary {
            background-color: #555;
        }
        button.danger {
            background-color: #d32f2f;
        }
        .target-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        /* Il quadrato bianco per i colpi sbagliati */
        .target-box {
            width: 320px;
            height: 320px;
            background-color: var(--target-box);
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #555;
            touch-action: none;
        }
        /* Il bersaglio nero centrale */
        .target-center {
            width: 150px;
            height: 150px;
            background-color: var(--target-center);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Lascia passare i click al contenitore */
        }
        .shot {
            width: 24px;
            height: 24px;
            background-color: var(--shot-color);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            cursor: grab;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            user-select: none;
        }
        .shot:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.3);
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .slider-container span {
            min-width: 60px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="display-name">Nessun Atleta</span>
        <span id="display-series">0T</span>
    </div>

    <div class="controls">
        <select id="athlete-select"></select>
        <button id="btn-position" class="secondary" onclick="togglePosition()">Posizione: T</button>
    </div>

    <div class="target-container">
        <div class="target-box" id="target-box">
            <div class="target-center"></div>
        </div>
    </div>

    <div class="slider-container">
        <input type="range" id="time-slider" min="0" max="0" value="0" step="1">
        <span id="slider-val">0 / 0</span>
    </div>

    <div class="controls">
        <button onclick="saveSeries()">Salva Serie</button>
        <button class="secondary" onclick="exportImage()">Esp. Immagine</button>
        <button class="danger" onclick="clearTargetAndState()">Reset Serie</button>
    </div>

    <script>
        const MAX_SHOTS = 8;
        const STORAGE_KEY = 'biathlon_tracker_data';

        let state = {
            athletes: [
                { id: 1, name: "Atleta Alpha", seriesT: 1, seriesP: 1 },
                { id: 2, name: "Atleta Beta", seriesT: 1, seriesP: 1 }
            ],
            currentAthleteId: 1,
            currentPos: 'T',
            currentShots: [],
            history: []
        };

        const targetEl = document.getElementById('target-box');
        const athleteSelect = document.getElementById('athlete-select');
        const slider = document.getElementById('time-slider');
        const sliderVal = document.getElementById('slider-val');
        let draggedShot = null;

        function init() {
            loadState();
            
            // Popola atleti
            athleteSelect.innerHTML = '';
            state.athletes.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = a.name;
                if(a.id === state.currentAthleteId) opt.selected = true;
                athleteSelect.appendChild(opt);
            });
            
            athleteSelect.addEventListener('change', (e) => {
                state.currentAthleteId = parseInt(e.target.value);
                saveState();
                updateHeader();
            });

            // Gestione slider
            slider.addEventListener('input', updateVisualsFromSlider);

            updateHeader();
            renderShotsFromState();
        }

        // --- GESTIONE STATO E PERSISTENZA ---
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateSliderMax();
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    console.error("Errore caricamento dati corrotti.");
                }
            }
        }

        // --- INTERFACCIA ---
        function updateHeader() {
            const athlete = state.athletes.find(a => a.id === state.currentAthleteId);
            document.getElementById('display-name').textContent = athlete.name;
            const seriesNum = state.currentPos === 'T' ? athlete.seriesT : athlete.seriesP;
            document.getElementById('display-series').textContent = `${seriesNum}${state.currentPos}`;
            document.getElementById('btn-position').textContent = `Posizione: ${state.currentPos}`;
        }

        function togglePosition() {
            state.currentPos = state.currentPos === 'T' ? 'P' : 'T';
            saveState();
            updateHeader();
        }

        // --- GESTIONE BERSAGLIO E COLPI ---
        targetEl.addEventListener('pointerdown', (e) => {
            if (e.target.classList.contains('shot')) {
                draggedShot = e.target;
                targetEl.setPointerCapture(e.pointerId);
            } else if (e.target.id === 'target-box' || e.target.classList.contains('target-center')) {
                // Se stavo guardando lo storico con lo slider, riporta lo slider al massimo prima di sparare
                if (parseInt(slider.value) < state.currentShots.length) {
                    slider.value = state.currentShots.length;
                    updateVisualsFromSlider();
                }

                if (state.currentShots.length >= MAX_SHOTS) {
                    return; // Limite raggiunto
                }

                const rect = targetEl.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                createShot(x, y);
            }
        });

        targetEl.addEventListener('pointermove', (e) => {
            if (draggedShot) {
                const rect = targetEl.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                
                x = Math.max(0, Math.min(x, rect.width));
                y = Math.max(0, Math.min(y, rect.height));

                draggedShot.style.left = `${x}px`;
                draggedShot.style.top = `${y}px`;
                
                const seq = parseInt(draggedShot.dataset.seq);
                state.currentShots[seq - 1].x = x;
                state.currentShots[seq - 1].y = y;
            }
        });

        targetEl.addEventListener('pointerup', (e) => {
            if (draggedShot) {
                targetEl.releasePointerCapture(e.pointerId);
                draggedShot = null;
                saveState(); // Salva la nuova posizione
            }
        });

        function createShot(x, y) {
            const seq = state.currentShots.length + 1;
            state.currentShots.push({ seq, x, y });
            saveState();
            
            appendShotDOM(seq, x, y);
            slider.value = state.currentShots.length;
            updateVisualsFromSlider();
        }

        function appendShotDOM(seq, x, y) {
            const shotEl = document.createElement('div');
            shotEl.className = 'shot';
            shotEl.dataset.seq = seq;
            shotEl.style.left = `${x}px`;
            shotEl.style.top = `${y}px`;
            shotEl.textContent = seq;
            targetEl.appendChild(shotEl);
        }

        function renderShotsFromState() {
            // Pulisce solo i colpi, non il centro del bersaglio
            const shots = targetEl.querySelectorAll('.shot');
            shots.forEach(s => s.remove());

            state.currentShots.forEach(s => {
                appendShotDOM(s.seq, s.x, s.y);
            });
            
            slider.value = state.currentShots.length;
            updateSliderMax();
            updateVisualsFromSlider();
        }

        function updateSliderMax() {
            const len = state.currentShots.length;
            slider.max = len;
            sliderVal.textContent = `${slider.value} / ${len}`;
        }

        function updateVisualsFromSlider() {
            const visibleCount = parseInt(slider.value);
            const len = state.currentShots.length;
            sliderVal.textContent = `${visibleCount} / ${len}`;

            const shots = targetEl.querySelectorAll('.shot');
            shots.forEach(shotEl => {
                const seq = parseInt(shotEl.dataset.seq);
                shotEl.style.display = seq <= visibleCount ? 'flex' : 'none';
            });
        }

        // --- AZIONI ---
        function clearTargetAndState() {
            state.currentShots = [];
            saveState();
            renderShotsFromState();
        }

        function saveSeries() {
            if (state.currentShots.length === 0) return alert("Nessun colpo da salvare.");
            
            const athlete = state.athletes.find(a => a.id === state.currentAthleteId);
            const seriesNum = state.currentPos === 'T' ? athlete.seriesT : athlete.seriesP;

            state.history.push({
                athlete: athlete.name,
                position: state.currentPos,
                series: `${seriesNum}${state.currentPos}`,
                shots: [...state.currentShots],
                timestamp: new Date().toISOString()
            });

            if (state.currentPos === 'T') athlete.seriesT++;
            else athlete.seriesP++;

            clearTargetAndState();
            updateHeader();
        }

        function exportImage() {
            // Crea un canvas temporaneo
            const canvas = document.createElement('canvas');
            const size = 320;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Sfondo bianco (carta)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            // Bersaglio nero centrale
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(size/2, size/2, 75, 0, Math.PI * 2); // raggio 75 = diametro 150
            ctx.fill();

            // Disegna i colpi visibili in base allo slider
            const visibleCount = parseInt(slider.value);
            
            for(let i=0; i < visibleCount; i++) {
                const s = state.currentShots[i];
                
                // Cerchio rosso
                ctx.fillStyle = '#ff3b30';
                ctx.beginPath();
                ctx.arc(s.x, s.y, 12, 0, Math.PI * 2); // raggio 12
                ctx.fill();
                
                // Bordo bianco
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Testo interno
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.seq.toString(), s.x, s.y);
            }

            // Scarica
            const link = document.createElement('a');
            const athlete = state.athletes.find(a => a.id === state.currentAthleteId);
            const sName = state.currentPos === 'T' ? athlete.seriesT : athlete.seriesP;
            
            link.download = `${athlete.name}_${sName}${state.currentPos}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Avvia
        init();
    </script>
</body>
</html>
